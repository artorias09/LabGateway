<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabGateway</title><style>
:root{font-family:system-ui,Arial;background:#0c1423;color:#edf4ff}body{max-width:950px;margin:38px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:27px}a{color:#7cdac5}article{background:#172238;padding:23px;border:1px solid #2e4058;border-radius:15px;margin:18px 0}input,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #43546c}input{background:#0c1423;color:white;max-width:100%}input[type=file]{width:85%}button{cursor:pointer;background:#22a184;color:#fff;border:0}label{display:block;margin:12px 0 5px}table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #32425a}small{color:#b3c4da}pre{background:#090f19;padding:12px;overflow:auto;white-space:pre-wrap}.warn{color:#f8c789}.note{background:#223e45;padding:10px;border-radius:7px}</style></head><body>
<header><h1>◈ LabGateway</h1>{% if session.uid %}<div>{{ session.username }} · {{ 'Professor' if session.role=='teacher' else 'Aluno' }} <form style="display:inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="_csrf" value="{{ csrf() }}"><button>Sair</button></form></div>{% endif %}</header>
{% for msg in get_flashed_messages() %}<div class="note">{{ msg }}</div>{% endfor %}
{% block content %}{% endblock %}
<footer><small>LabGateway · execução isolada · Python v1</small></footer></body></html>
